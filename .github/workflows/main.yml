name: VFS India Passport Appointment Monitor

on:
  schedule:
    # GitHub's minimum scheduled interval is 5 minutes.
    - cron: "*/5 * * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vfs-passport-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run VFS monitor
        env:
          VFS_USERNAME: ${{ secrets.VFS_USERNAME }}
          VFS_PASSWORD: ${{ secrets.VFS_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          VFS_BOOKING_URL: ${{ vars.VFS_BOOKING_URL }}
        run: python monitor.py

      - name: Upload diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: vfs-monitor-diagnostics
          path: artifacts/
          retention-days: 3
